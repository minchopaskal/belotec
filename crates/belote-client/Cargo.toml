[package]
name = "belote-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
belote-core.workspace = true
serde_json.workspace = true
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "=0.2.104"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlInputElement", "Location", "Storage", "WebSocket", "MessageEvent", "CloseEvent", "Event", "Navigator", "Clipboard", "AudioContext", "AudioDestinationNode", "AudioNode", "OscillatorNode", "OscillatorType", "AudioParam", "GainNode"] }
console_error_panic_hook = "0.1"
